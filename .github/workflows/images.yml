name: images

# Builds the backend and frontend container images in CI and pushes them to Google
# Artifact Registry, so the production VM never has to build anything -- it just
# pulls a finished, immutable image (deploy/deploy.sh <tag>). Every image is tagged
# with the short commit SHA (for exact rollbacks) and `latest`.
#
# Auth is keyless: GitHub proves its identity with a short-lived OIDC token
# (Workload Identity Federation). There is no stored Google key. Google only
# accepts tokens from THIS repo on the `main` branch, and the identity it maps to
# can do one thing: push images to the glassbox repository.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "deploy/**", "docker-compose.yml", ".github/**"]  # none of these end up inside an image
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # lets the job request the OIDC token used to talk to Google

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: us-central1-docker.pkg.dev/project-f015cf71-9e01-4a2a-8f5/glassbox
  WIF_PROVIDER: projects/1070717138144/locations/global/workloadIdentityPools/github/providers/glassbox
  WIF_SERVICE_ACCOUNT: github-deployer@project-f015cf71-9e01-4a2a-8f5.iam.gserviceaccount.com
  # Public origins baked into the browser bundle (not secrets: they are visible in any page's JS).
  PUBLIC_URL: https://glassbox-portfolio-review.duckdns.org
  PUBLIC_WS_URL: wss://glassbox-portfolio-review.duckdns.org/ws/signals

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Dependency vulnerability scan
        run: python -m pip_audit -r requirements.txt --progress-spinner off

  build-and-push:
    needs: test  # never publish an image whose tests fail
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Let Docker push to Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/backend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PUBLIC_URL }}
            NEXT_PUBLIC_WS_URL=${{ env.PUBLIC_WS_URL }}
          tags: |
            ${{ env.REGISTRY }}/frontend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Summary
        run: |
          {
            echo "### Images published"
            echo "Tag: \`${{ steps.meta.outputs.tag }}\`"
            echo
            echo "Deploy on the server:"
            echo '```'
            echo "cd ~/glassbox && deploy/deploy.sh ${{ steps.meta.outputs.tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
